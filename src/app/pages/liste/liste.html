<div style="text-align: center; margin-top: 20px;">
  <h2 style="margin-bottom: 20px; color: #555;">Sélectionnez un film</h2>

  <!-- Liste des 5 boutons centrés en haut -->
  <div style="display: flex; justify-content: center; gap: 12px; margin-bottom: 30px; flex-wrap: wrap;">
    <button 
      *ngFor="let film of films" 
      (click)="selectFilm(film)" 
      style="padding: 10px 18px; cursor: pointer; border-radius: 6px; border: 1px solid #007bff; background-color: #ffffff; color: #007bff; font-weight: bold; font-size: 14px; transition: 0.2s;"
      [style.background-color]="selectedFilm?.title === film.title ? '#007bff' : '#ffffff'"
      [style.color]="selectedFilm?.title === film.title ? '#ffffff' : '#007bff'">
      {{ film.title }}
    </button>
  </div>

  <!-- Affichage au clic : Titre + Affiche réelle du film -->
  <div *ngIf="selectedFilm" style="margin-top: 20px;">
    <h3 style="font-size: 22px; color: #222;">{{ selectedFilm.title }}</h3>
    <img 
      [src]="selectedFilm.poster" 
      [alt]="selectedFilm.title" 
      style="width: 260px; height: 380px; object-fit: cover; border-radius: 10px; box-shadow: 0 6px 15px rgba(0,0,0,0.25); margin-top: 15px;" />
  </div>
</div>
